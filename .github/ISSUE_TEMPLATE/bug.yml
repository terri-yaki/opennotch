name: Bug report
description: Something in OpenNotch does not work as expected
title: ""
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.0"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: OpenNotch version
      description: The version shown in the menu bar item, or the release you installed.
      placeholder: "0.1.0"
    validations:
      required: false
